<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
</head>
<body>
    <h1>Formulario</h1>
    <form action="#" method="get">
        <label for="tematica">Tematica:</label>
        <input type="text" name="tematica" id="tematica"><br>
        
        <label for="color">Ajuste el color:</label>
        <input type="color" name="color" id="color"><br>

        <label for="contraste">Contraste</label>
        <input type="range" name="contraste" id="contraste" value="50" max="100" min="0" step="1"><br>

        <label for="brillo">Brillo</label>
        <input type="range" name="brillo" id="brillo" value="50" max="100" min="0" step="1"><br>

        <input type="submit" name="Enviar" value="Enviar">
    </form>
</body>
</html>
