<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>
    <h1>Formulario</h1>
    <form action="#" method="get">
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre">
        
        <p>Años de experiencia:</p>
        <input type="radio" name="exp" id="1" value="1">
        <label for="1">1 año o menos</label><br>
        <input type="radio" name="exp" id="2" value="2">
        <label for="2">2 años</label><br>
        <input type="radio" name="exp" id="3" value="3">
        <label for="3">3 años</label><br>
        <input type="radio" name="exp" id="4" value="4">
        <label for="4">4 años o mas</label><br>

        <p>Requisitos:</p>
        <label for="ingles">B2 de ingles</label>
        <input type="checkbox" name="ingles" id="ingles" value="ingles"><br>
        <label for="coche">Carné de conducir</label>
        <input type="checkbox" name="coche" id="coche" value="coche"><br>

        Introduzca su CV:<input type="file" name="cv"><br>

        <input type="submit" name="Enviar" value="Enviar">
    </form>
</body>
</html>
