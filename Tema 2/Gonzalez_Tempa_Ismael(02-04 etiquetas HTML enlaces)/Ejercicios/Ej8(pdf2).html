<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces a pdf</title>
</head>
<body>
    <h2>Ejercicio 8</h2>
    <h3>Object</h3>
    <object data="Gonzalez_Tempa_Ismael(02-01 Estructura HTML y la etiqueta body).pdf" 
    type="application/pdf"
    width="600"
    height="500">
        <p>Tu navegador no puede mostrar el pdf
            <a href="Gonzalez_Tempa_Ismael(02-01 Estructura HTML y la etiqueta body).pdf" download>Descargalo aqui</a>
        </p>
    </object>

    <h3>Embed</h3>
    <embed src="Gonzalez_Tempa_Ismael(02-01 Estructura HTML y la etiqueta body).pdf" 
    type="application/pdf" 
    width="600" 
    height="500">

    <h3>Iframe</h3>
    <iframe src="Gonzalez_Tempa_Ismael(02-01 Estructura HTML y la etiqueta body).pdf" 
    width="600"
    height="500"
    style="border: none;"></iframe>
</body>
</html>
