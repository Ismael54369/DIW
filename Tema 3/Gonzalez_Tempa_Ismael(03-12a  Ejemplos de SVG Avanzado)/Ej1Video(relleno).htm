<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        svg { font-family: 'Arial Black', sans-serif; font-weight: bold; }
    </style>
</head>
<body>

<svg width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="arcoiris" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="crimson"/>
      <stop offset="20%" stop-color="orange"/>
      <stop offset="40%" stop-color="gold"/>
      <stop offset="60%" stop-color="green"/>
      <stop offset="80%" stop-color="blue"/>
      <stop offset="100%" stop-color="purple"/>
    </linearGradient>

    <pattern id="patronRainbow" x="0" y="0" width="100%" height="100%" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100%" height="100%" fill="url(#arcoiris)" />
    </pattern>
  </defs>

  <text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="80" fill="url(#patronRainbow)">
    GRADIENTE
  </text>
</svg>

</body>
</html>
