<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            background-color: #222; color: white; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; font-family: sans-serif;
        }

        .contenedor-imagen {
            position: relative;
            width: 400px;
            height: 300px;
        }

        /* Imagen que se revelará */
        .imagen-wally {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Vinculamos la imagen al clipPath del SVG */
            clip-path: url(#recorteCircular);
        }

        /* Interacción: Cuando hacemos hover sobre el contenedor */
        .contenedor-imagen:hover .circulo-recorte {
            r: 300; /* Aumentamos el radio para mostrar toda la imagen */
        }
        
        /* Transición suave del radio */
        .circulo-recorte {
            transition: r 0.8s ease-in-out;
        }
    </style>
</head>
<body>

    <h1>Pasa el ratón para revelar</h1>

    <div class="contenedor-imagen">
        <img src="https://picsum.photos/id/237/400/300" class="imagen-wally" alt="Perro">
        
        <svg width="0" height="0">
            <defs>
                <clipPath id="recorteCircular">
                    <circle class="circulo-recorte" cx="200" cy="150" r="30" />
                </clipPath>
            </defs>
        </svg>
    </div>

</body>
</html>
