<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2: Texto Ismael Degradado</title>
    <style>
        body { 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        svg {
            font-family: 'Arial Black', sans-serif; /* Tipografía gruesa */
            font-weight: bold;
        }
    </style>
</head>
<body>

<svg width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="gradienteIsmael" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:crimson;stop-opacity:1" />
      <stop offset="20%" style="stop-color:orange;stop-opacity:1" />
      <stop offset="40%" style="stop-color:gold;stop-opacity:1" />
      <stop offset="60%" style="stop-color:limegreen;stop-opacity:1" />
      <stop offset="80%" style="stop-color:dodgerblue;stop-opacity:1" />
      <stop offset="100%" style="stop-color:purple;stop-opacity:1" />
    </linearGradient>
  </defs>

  <text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="150" fill="url(#gradienteIsmael)">
    Ismael
  </text>
</svg>

</body>
</html>
