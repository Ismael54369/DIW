<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Icono con etiqueta LINK</title>

    <!-- GIF animado como icono (Firefox lo soporta) -->
    <link rel="icon" type="image/gif" href="logo.gif">

</head>
<body>
    <h1>Ejemplo usando el icono mediante &lt;link&gt;</h1>
    <p>Aquí puedes cambiar entre ICO, PNG o GIF animado.</p>
</body>
</html>
