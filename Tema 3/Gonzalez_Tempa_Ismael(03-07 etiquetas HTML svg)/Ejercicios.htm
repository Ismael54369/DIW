<p><b>EJERCICIO 2</b></p>
<!-- Círculo de 300 dentro de otro de 200 width/height = 300 x 300 viewBox = 250 x 250 -->

    <!-- Círculo grande (diámetro 300 → radio 150) -->

    <!-- Círculo pequeño (diámetro 200 → radio 100) -->
    <circle cx="125" cy="125" r="80" fill="lightgreen" />
</svg>
