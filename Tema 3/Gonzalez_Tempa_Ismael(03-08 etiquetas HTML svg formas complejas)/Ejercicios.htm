<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 03-08</title>
</head>
<body>
    <p><b>Ejercicio 1</b></p>
    <svg viewBox="-100 -100 310 310" xmlns="http://www.w3.org/2000/svg"
    width="200" height="200" >
        <circle cx="100" cy="100" r="20" stroke="#ffff77" fill="transparent" stroke-width="3"/>
        <circle cx="100" cy="100" r="40" stroke="#ffff00" fill="transparent" stroke-width="6"/>
        <circle cx="100" cy="100" r="60" stroke="#EEEE00" fill="transparent" stroke-width="9"/>
        <circle cx="100" cy="100" r="80" stroke="orange" fill="transparent" stroke-width="12"/>
        <circle cx="100" cy="100" r="100" stroke="darkorange" fill="transparent" stroke-width="15"/>
    </svg>
    
    <br>
    <svg width="120" height="120" viewBox="0 0 120 120" version="1.1" xmlns="http://www.w3.org/2000/svg" width="200" height="200" >
        <rect x="10" y="10" width="100" height="100"> </rect>
    </svg>

    <br>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="200" height="200" viewBox="-100 -100 200 200">
        <circle cx="0" cy="0" r="75" fill="none" stroke="red" stroke-width="5" />
        <circle cx="0" cy="0" r="50" fill="none" stroke="blue" stroke-width="5" />
        <circle cx="0" cy="0" r="25" fill="none" stroke="green" stroke-width="5" />
    </svg>

    <br>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="100" height="100"
    style="background-color: lightgray">
        <circle cx="50" cy="50" r="50" fill="none" stroke="red" stroke-width="1" />
    </svg>

    <br>
    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" width="200" height="200" >
        <ellipse cx="100" cy="50" rx="100" ry="50" />
    </svg>

    <br>
    <svg viewBox="-100 -100 310 310" xmlns="http://www.w3.org/2000/svg" width="200"
    height="200" >
        <ellipse cx="75" cy="75" rx="10" ry="50" stroke="orange" fill="transparent" stroke-width="3"/>
        <ellipse cx="75" cy="75" rx="20" ry="40" stroke="orange" fill="transparent" stroke-width="3"/>
        <ellipse cx="75" cy="75" rx="30" ry="30" stroke="orange" fill="transparent" stroke-width="3"/>
        <ellipse cx="75" cy="75" rx="40" ry="10" stroke="orange" fill="transparent" stroke-width="3"/>
        <ellipse cx="75" cy="75" rx="50" ry="0" stroke="orange" fill="transparent" stroke-width="3"/>
    </svg>

    <br>
    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" >
        <polyline points="0,100 50,25 50,75 100,0" fill="red" />
        <polyline points="100,100 150,25 150,75 200,0" fill="none" stroke="black" />
    </svg>

    <br>
    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,100 50,25 50,75 100,0" />
        <!-- Example of the same polygon shape with stroke and no fill -->
        <polygon points="100,100 150,25 150,75 200,0" fill="none" stroke="black" />
    </svg>

    <br>
    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" width="200" height="200" >
        <path fill="none" stroke="lightgrey" d="M20,50 C20,-50 180,150 180,50 C180-50 20,150 20,50 z" />
    </svg>

    <p><b>Ejercicio 2</b></p>
    <svg width="200" height="200" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <style>circle{fill:none;}</style>
        
        <circle cx="60" cy="60" r="50" stroke="#DD8800" stroke-width="7"/>
        <circle cx="60" cy="60" r="40" stroke="#EAA900" stroke-width="5"/>
        <circle cx="60" cy="60" r="30" stroke="#F5C000" stroke-width="3"/>
        <circle cx="60" cy="60" r="20" stroke="#FFEE00" stroke-width="2"/>
        <circle cx="60" cy="60" r="10" stroke="#FFFF00" stroke-width="1"/>
    </svg>

    <p><b>Ejercicio 3</b></p>
    <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
        <line x1="100" y1="10" x2="100" y2="190" stroke="red" stroke-width="2"/>
        <line x1="10" y1="100" x2="190" y2="100" stroke="blue" stroke-width="2"/>
        <line x1="130" y1="10" x2="130" y2="190" stroke="green" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="10" y1="130" x2="190" y2="130" stroke="yellow" stroke-width="1" stroke-dasharray="4,4"/>
    </svg>

    <p><b>Ejercicio 4</b></p>
    <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="40" fill="none" stroke="red" stroke-width="2"/>
        <line x1="100" y1="20" x2="100" y2="180" stroke="blue" stroke-width="2"/>
        <line x1="20" y1="100" x2="180" y2="100" stroke="green" stroke-width="2"/>
    </svg>

    <p><b>Ejercicio 5</b></p>
    <svg width="250" height="250" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <style>
            /* Estilo simple para las líneas adicionales */
            .p { stroke-width: 1; stroke-dasharray: 4,4; }
        </style>
        
        <circle cx="100" cy="100" r="40" fill="none" stroke="red" stroke-width="2"/>
        
        <line x1="100" y1="20" x2="100" y2="180" stroke="blue" stroke-width="2"/>
        <line x1="20" y1="100" x2="180" y2="100" stroke="green" stroke-width="2"/>
        
        <line x1="60" y1="20" x2="60" y2="180" stroke="blue" class="p"/>
        <line x1="140" y1="20" x2="140" y2="180" stroke="blue" class="p"/>
        <line x1="20" y1="60" x2="180" y2="60" stroke="green" class="p"/>
        <line x1="20" y1="140" x2="180" y2="140" stroke="green" class="p"/>
    </svg>

    <p><b>Ejercicio 6</b></p>
    <svg width="150" height="150" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <style>
            /* Estilo común: borde naranja, sin relleno */
            .e { stroke: orange; fill: transparent; stroke-width: 3; }
        </style>
        
        <ellipse cx="50" cy="50" rx="10" ry="50" class="e"/>
        <ellipse cx="50" cy="50" rx="20" ry="40" class="e"/>
        <ellipse cx="50" cy="50" rx="30" ry="30" class="e"/>
        <ellipse cx="50" cy="50" rx="40" ry="10" class="e"/>
    </svg>

    <p><b>Ejercicio 7</b></p>
    <svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="20" width="30" height="30" fill="#7B9EBF" />
        <polygon points="65,20 50,50 80,50" fill="orange" />
        <path d="M 65, 63 a 12,12 0 1,0 0,24 a 12,12 0 1,0 0,-24" fill="red" />
        <!--He usado path porque con circle no me salia el circulo-->
    </svg>

    <p><b>Ejercicio 8</b></p>
    <svg width="400" height="200" viewBox="-15 -30 100 80" xmlns="http://www.w3.org/2000/svg">
          <style>.path-style { fill: none; stroke: #333; stroke-width: 0.5; }</style>
          <path class="path-style" 
                d="M -3 -7 C -2 -9 -3 -11 -6 -6 C 9 0 6 4 -8 -2 C -20 -11 -4.6667 -13.3333 -2 -16 C 9 -21 11 -13 17 1"/>
    </svg>
</body>
</html>
