<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Robot Animation</title>
    <link rel="stylesheet" href="robot.css"> 
</head>
<body>
    <svg id="robot" width="300" height="400" viewBox="0 0 300 400">
        <g id="leftFoot" transform="translate(100, 300)">
            <rect width="20" height="50" fill="#2c3e50" />
            <g class="lowerLeg" transform="translate(0, 50)">
                <rect width="20" height="50" fill="#34495e" />
            </g>
        </g>
        <g id="rightFoot" transform="translate(180, 300)">
            <rect width="20" height="50" fill="#2c3e50" />
            <g class="lowerLeg" transform="translate(0, 50)">
                <rect width="20" height="50" fill="#34495e" />
            </g>
        </g>

        <g id="lowerTrunk" transform="translate(90, 250)">
            <rect width="120" height="50" rx="10" fill="#95a5a6" />
        </g>

        <g id="upperTorso" transform="translate(150, 200)">
            <rect x="-60" y="-80" width="120" height="80" rx="10" fill="#bdc3c7" />
            
            <g id="leftArm" transform="translate(-60, -60)">
                <rect width="20" height="60" fill="#7f8c8d"/>
                <g class="forearm" transform="translate(0, 60)">
                    <rect width="20" height="50" fill="#95a5a6"/>
                </g>
            </g>
            <g id="rightArm" transform="translate(60, -60)">
                <rect width="20" height="60" fill="#7f8c8d"/>
                <g class="forearm" transform="translate(0, 60)">
                    <rect width="20" height="50" fill="#95a5a6"/>
                </g>
            </g>
        </g>

        <g id="head" transform="translate(150, 120)">
            <rect x="-30" y="-60" width="60" height="60" rx="8" fill="#ecf0f1" />
            <g id="leftAntenna"><line x1="-10" y1="-60" x2="-20" y2="-90" stroke="#333" stroke-width="2"/><ellipse cx="-20" cy="-90" rx="5" ry="5"/></g>
            <g id="rightAntenna"><line x1="10" y1="-60" x2="20" y2="-90" stroke="#333" stroke-width="2"/><ellipse cx="20" cy="-90" rx="5" ry="5"/></g>
        </g>
    </svg>
</body>
</html>
