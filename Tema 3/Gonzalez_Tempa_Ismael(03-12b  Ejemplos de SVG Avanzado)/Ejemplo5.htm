<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Casa</title>
    <link rel="stylesheet" href="ej8.css">
    <style>
        /* Variables necesarias para que el CSS funcione sin JS */
        :root {
            --house--size: 60px;
            --foundation--height: 10px;
            --foundation--width: 120px;
        }
    </style>
</head>
<body class="ready">
    <main>
        <div id="artboard">
            <svg class="figure" viewBox="0 0 300 300" width="100%" height="100%">
                <g class="figure-container" transform="translate(150, 150)">
                    <rect class="ground__shadow" shadow="1" width="200" height="10" rx="5" />
                    
                    <g class="tree" tree="1"><circle class="tree__fooliage" r="15"/><rect class="tree__trunk" width="5" height="20"/></g>
                    <g class="tree" tree="2"><circle class="tree__fooliage" r="12"/><rect class="tree__trunk" width="4" height="15"/></g>
                    
                    <g class="foundation__floor">
                        <rect width="100" height="10"/>
                        <rect width="10" height="10"/>
                    </g>
                    
                    <g class="foundation__pole" pole="1"><rect class="foundation__pole--front"/><rect class="foundation__pole--back"/></g>
                    <g class="foundation__pole" pole="2"><rect class="foundation__pole--front"/><rect class="foundation__pole--back"/></g>

                    <g class="house">
                        <rect class="house__entrance__wall" width="60" height="80"/>
                        
                        <g class="house__entrance__sliding-door">
                            <rect class="house__entrance__sliding-door__frame" width="50" height="70"/>
                            <rect class="house__entrance__sliding-door__glass" glass="1" width="10" height="60"/>
                        </g>

                        <g class="house__roof">
                            <rect class="house__roof__tiles" width="80" height="10"/>
                            <g class="house__roof__tower">
                                <rect class="house__roof__tower__front-wall" width="20" height="20"/>
                                <rect class="house__roof__tower__roof" width="25" height="5"/>
                            </g>
                        </g>
                    </g>
                </g>
            </svg>
        </div>
    </main>
</body>
</html>
