<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Sintaxis CSS</title>
    <style>
        /* Estilo para que la tabla se vea bien (usando el modelo de cajas del PDF) */
        table {
            border: 2px solid #333;
            border-collapse: collapse; /* Para que las líneas sean simples */
            width: 300px;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #666;
            padding: 10px; /* Aplicamos padding como en el ejercicio 8 */
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
        }

        /* Clase para la imagen */
        .img-sintaxis {
            border: 1px solid #ccc;
            padding: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Ejercicio 2: Sintaxis de una Regla CSS</h1>

    <img src="sintaxis.png" alt="Esquema de sintaxis CSS" class="img-sintaxis" width="450">

    

    <table>
        <thead>
            <tr>
                <th>Nº</th>
                <th>Concepto CSS</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>1</td><td>Regla CSS</td></tr>
            <tr><td>2</td><td>Selector</td></tr>
            <tr><td>3</td><td>Declaración</td></tr>
            <tr><td>4</td><td>Valores</td></tr>
            <tr><td>5</td><td>Propiedad</td></tr>
            <tr><td>6</td><td>Separador (:)</td></tr>
            <tr><td>7</td><td>Separador (;)</td></tr>
            <tr><td>8</td><td>Llaves { }</td></tr>
        </tbody>
    </table>

</body>
</html>
